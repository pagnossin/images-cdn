name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Start NATS
        run: docker run -d -p 4222:4222 nats:2-alpine -js
      - name: Tests
        run: pytest -v --cov
        env:
          NATS_URL: nats://localhost:4222
          REQUIRE_NATS: "1"
      - name: Docker build
        run: docker build -t images-cdn .
      - name: End-to-end scenarios
        run: |
          docker run -d -p 8080:8080 images-cdn
          python scripts/demo.py --url http://localhost:8080
